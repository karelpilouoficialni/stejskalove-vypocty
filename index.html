<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Počítání mezd - Dana Stejskalová</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Segoe UI,system-ui,sans-serif;background:linear-gradient(135deg,#fef9e7,#fdebd0);min-height:100vh;color:#2c3e50;display:flex;justify-content:center;align-items:center;padding:20px}
.container{width:100%;max-width:800px;background:#fff;border-radius:24px;box-shadow:0 8px 40px rgba(0,0,0,.1);padding:30px;position:relative}
.screen{display:none;animation:fadeIn .4s ease}
.screen.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}

/* Teacher header */
.teacher-box{text-align:center;margin-bottom:25px;position:relative}
.teacher-emoji{font-size:72px;display:block;line-height:1;margin-bottom:4px;transition:transform .3s}
.teacher-emoji.bounce{animation:bounce .4s ease}
@keyframes bounce{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.teacher-name{font-size:20px;font-weight:700;color:#8e44ad}
.teacher-sub{font-size:13px;color:#999;margin-top:-2px}

/* Welcome screen */
.welcome-title{text-align:center;font-size:28px;font-weight:800;color:#2c3e50;margin-bottom:6px}
.welcome-sub{text-align:center;color:#7f8c8d;font-size:15px;margin-bottom:24px}
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px}
.cat-btn{padding:12px 14px;border:2px solid #e0e0e0;border-radius:14px;background:#fafafa;cursor:pointer;text-align:left;font-size:14px;font-weight:600;transition:all .2s;user-select:none}
.cat-btn:hover{border-color:#bdc3c7;background:#f5f5f5}
.cat-btn.selected{border-color:#8e44ad;background:#f3e5f7;color:#6c3483}
.cat-btn .cat-icon{margin-right:8px}
.cat-btn.all-btn{border-color:#e67e22;background:#fef5e7;color:#d35400;grid-column:1/-1;text-align:center}
.cat-btn.all-btn.selected{border-color:#e67e22;background:#fdebd0}
.time-row{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.time-btn{padding:10px 18px;border:2px solid #e0e0e0;border-radius:10px;background:#fafafa;cursor:pointer;font-weight:600;font-size:14px;transition:all .2s;flex:1;text-align:center;min-width:80px}
.time-btn:hover{border-color:#bdc3c7}
.time-btn.selected{border-color:#2980b9;background:#d6eaf8;color:#1a5276}
.start-btn{display:block;width:100%;padding:16px;background:linear-gradient(135deg,#8e44ad,#6c3483);color:#fff;border:none;border-radius:16px;font-size:19px;font-weight:700;cursor:pointer;transition:transform .2s,box-shadow .2s}
.start-btn:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(142,68,173,.35)}
.start-btn:active{transform:translateY(0)}
.start-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

/* Game screen */
.game-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:8px}
.game-stat{font-weight:700;font-size:15px}
.game-stat span{color:#555;font-weight:400}
.timer{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.timer.warning{color:#e74c3c;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.progress-bar{width:100%;height:6px;background:#ecf0f1;border-radius:3px;margin-bottom:16px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#8e44ad,#e67e22);border-radius:3px;transition:width .5s ease;width:0}

.reaction-area{display:flex;align-items:center;gap:14px;padding:14px 18px;background:#f8f9fa;border-radius:14px;margin-bottom:18px;min-height:74px}
.reaction-emoji{font-size:44px;line-height:1;flex-shrink:0;width:52px;text-align:center}
.reaction-text{flex:1;font-size:15px;font-weight:600;line-height:1.3}
.reaction-sub{font-size:13px;color:#777;font-weight:400;display:block;margin-top:2px}

.question-box{font-size:18px;line-height:1.6;margin-bottom:18px;padding:16px 20px;background:#fef9e7;border-left:4px solid #f1c40f;border-radius:0 12px 12px 0;font-weight:500}
.question-unit{display:block;margin-top:4px;font-size:13px;color:#999;font-weight:400}

.answer-row{display:flex;gap:10px;margin-bottom:6px}
.answer-row input{flex:1;padding:14px 16px;border:2px solid #ddd;border-radius:12px;font-size:18px;font-weight:600;outline:none;transition:border-color .2s}
.answer-row input:focus{border-color:#8e44ad}
.answer-row input.correct{border-color:#27ae60;background:#eafaf1}
.answer-row input.wrong{border-color:#e74c3c;background:#fdedec}
.answer-row button{padding:14px 28px;background:#8e44ad;color:#fff;border:none;border-radius:12px;font-weight:700;font-size:16px;cursor:pointer;transition:background .2s;white-space:nowrap}
.answer-row button:hover{background:#6c3483}
.answer-row button:disabled{background:#bdc3c7;cursor:not-allowed}
.answer-feedback{font-size:14px;min-height:22px;margin-bottom:14px;font-weight:600}
.answer-feedback.correct{color:#27ae60}
.answer-feedback.wrong{color:#e74c3c}

/* Results screen */
.result-header{text-align:center;margin-bottom:16px}
.result-header .teacher-emoji{font-size:80px}
.result-title{font-size:28px;font-weight:800;margin-bottom:4px}
.result-sub{color:#7f8c8d;font-size:15px;margin-bottom:20px}
.stats-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:20px}
.stat-card{padding:16px;background:#f8f9fa;border-radius:14px;text-align:center}
.stat-num{font-size:28px;font-weight:800;color:#2c3e50}
.stat-label{font-size:12px;color:#888;margin-top:2px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.detail-list{max-height:260px;overflow-y:auto;margin-bottom:20px;border:1px solid #eee;border-radius:12px}
.detail-item{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid #f0f0f0;font-size:13px;gap:8px}
.detail-item:last-child{border-bottom:none}
.detail-item.result-correct{background:#eafaf1}
.detail-item.result-wrong{background:#fdedec}
.detail-q{flex:1;line-height:1.3}
.detail-a{font-weight:700;white-space:nowrap}
.detail-ua{color:#999;text-decoration:line-through;margin-right:6px;font-weight:400}
.detail-icon{font-size:18px;flex-shrink:0}
.restart-btn{display:block;width:100%;padding:16px;background:linear-gradient(135deg,#8e44ad,#6c3483);color:#fff;border:none;border-radius:16px;font-size:18px;font-weight:700;cursor:pointer;transition:transform .2s,box-shadow .2s}
.restart-btn:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(142,68,173,.35)}

@media(max-width:500px){
.container{padding:16px;border-radius:16px}
.cat-grid{grid-template-columns:1fr}
.cat-btn{padding:10px 12px;font-size:13px}
.question-box{font-size:16px;padding:12px 14px}
.answer-row input{font-size:16px;padding:12px}
.stats-grid{grid-template-columns:1fr 1fr}
.teacher-emoji{font-size:56px}
.game-header{flex-direction:column;align-items:stretch;text-align:center}
}
</style>
</head>
<body>

<div class="container" id="app">

<!-- WELCOME SCREEN -->
<div class="screen active" id="welcomeScreen">
<div class="teacher-box">
<span class="teacher-emoji">👩‍🏫</span>
<div class="teacher-name">Dana Stejskalová</div>
<div class="teacher-sub">učitelka počítání mezd</div>
</div>
<div class="welcome-title">Počítání mezd</div>
<div class="welcome-sub">Vyber, co chceš procvičovat, a začni hrát!</div>

<div class="cat-grid" id="categoryGrid">
<button class="cat-btn all-btn selected" data-cat="all"><span class="cat-icon">📋</span> Všechny kategorie</button>
<button class="cat-btn selected" data-cat="hruba_mzda"><span class="cat-icon">💰</span> Hrubá mzda</button>
<button class="cat-btn selected" data-cat="cista_mzda"><span class="cat-icon">🧾</span> Čistá mzda</button>
<button class="cat-btn selected" data-cat="castka_k_vyplate"><span class="cat-icon">💳</span> Částka k výplatě</button>
<button class="cat-btn selected" data-cat="dovolena"><span class="cat-icon">🏖️</span> Dovolená</button>
<button class="cat-btn selected" data-cat="nemocenska"><span class="cat-icon">🤒</span> Nemocenská</button>
<button class="cat-btn selected" data-cat="stizene_podminky"><span class="cat-icon">⚠️</span> Stížené pracovní podmínky</button>
</div>

<div class="time-row">
<button class="time-btn" data-time="120">⏱ 2 min</button>
<button class="time-btn selected" data-time="300">⏱ 5 min</button>
<button class="time-btn" data-time="600">⏱ 10 min</button>
<button class="time-btn" data-time="0">♾️ Neomezeně</button>
</div>

<button class="start-btn" id="startBtn">Začít hru!</button>
</div>

<!-- GAME SCREEN -->
<div class="screen" id="gameScreen">
<div class="game-header">
<div class="game-stat">Skóre: <span id="scoreDisplay">0/0</span></div>
<div class="timer" id="timerDisplay">05:00</div>
</div>
<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

<div class="reaction-area" id="reactionArea">
<span class="reaction-emoji" id="reactionEmoji">😊</span>
<div class="reaction-text" id="reactionText">
Hodně štěstí!
<span class="reaction-sub" id="reactionSub">Začínáme!</span>
</div>
</div>

<div class="question-box" id="questionBox">
Načítání otázky...
<span class="question-unit" id="questionUnit"></span>
</div>

<div class="answer-row">
<input type="number" id="answerInput" placeholder="Tvá odpověď..." autofocus>
<button id="submitBtn">Odeslat</button>
</div>
<div class="answer-feedback" id="answerFeedback"></div>
</div>

<!-- RESULTS SCREEN -->
<div class="screen" id="resultScreen">
<div class="result-header">
<span class="teacher-emoji" id="resultEmoji">😊</span>
<div class="result-title" id="resultTitle">Výborně!</div>
<div class="result-sub" id="resultSub">Tvůj výsledek</div>
</div>
<div class="stats-grid">
<div class="stat-card"><div class="stat-num" id="statScore">0</div><div class="stat-label">Správně</div></div>
<div class="stat-card"><div class="stat-num" id="statTotal">0</div><div class="stat-label">Celkem</div></div>
<div class="stat-card"><div class="stat-num" id="statPercent">0%</div><div class="stat-label">Úspěšnost</div></div>
</div>
<div class="detail-list" id="detailList"></div>
<button class="restart-btn" id="restartBtn">Hrát znovu</button>
</div>

</div><!-- /container -->

<script>
// ============================================================
// CATEGORY DEFINITIONS
// ============================================================
const CATS = [
{id:'hruba_mzda',label:'Hrubá mzda',icon:'💰'},
{id:'cista_mzda',label:'Čistá mzda',icon:'🧾'},
{id:'castka_k_vyplate',label:'Částka k výplatě',icon:'💳'},
{id:'dovolena',label:'Dovolená',icon:'🏖️'},
{id:'nemocenska',label:'Nemocenská',icon:'🤒'},
{id:'stizene_podminky',label:'Stížené pracovní podmínky',icon:'⚠️'}
];

// ============================================================
// REACTIONS
// ============================================================
const REACTIONS = {
veryBad:{emoji:'😠',text:'To je vážně špatné!',sub:'Musíš se mnohem víc snažit.'},
bad:{emoji:'🙁',text:'No, neoslovilo mě to...',sub:'Zkus to znovu a líp.'},
medium:{emoji:'😐',text:'Tak napůl...',sub:'Může to být lepší.'},
good:{emoji:'🙂',text:'Dobrá práce!',sub:'Jdeš správným směrem.'},
veryGood:{emoji:'😊',text:'Výborně! Perfektní!',sub:'Takhle se to dělá!'}
};
const REACTIONS_GUESS = {
correct:[{emoji:'😊',text:'Správně! Paráda!',sub:'Tohle ti jde!'},{emoji:'🙂',text:'Ano, správně!',sub:'Dobře počítáš.'},{emoji:'😊',text:'Přesně tak!',sub:'Jednička s hvězdičkou!'},{emoji:'🙂',text:'Výborný výpočet!',sub:'Na to jsi přišel rychle.'}],
wrong:[{emoji:'😠',text:'Špatně!',sub:'Zkus dávat větší pozor.'},{emoji:'🙁',text:'Bohužel ne...',sub:'Správná odpověď je uvedená.'},{emoji:'😐',text:'Trefa vedle.',sub:'Zkus to příště líp.'},{emoji:'🙁',text:'Nesprávně.',sub:'Nevadí, příště to dáš.'}]
};

function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}
function rand(min,max){return Math.floor(Math.random()*(max-min+1))+min}

// ============================================================
// QUESTION GENERATORS
// ============================================================
const generators = {};

// ---------- HRUBÁ MZDA ----------
generators.hruba_mzda = [
function(){
let rate=rand(100,220)*5; // 500-1100
let h=rand(16,23);
return {q:`Pan/paní Novák odpracoval ${h} dní s hodinovou sazbou ${rate} Kč. Jaká je jeho hrubá mzda? (počet hodin denně: 8)`,a:h*8*rate,unit:'Kč'};
},
function(){
let salary=rand(250,600)*100; // 25000-60000
let d=rand(10,22);
let td=rand(22,23);
return {q:`Zaměstnanec má měsíční mzdu ${salary} Kč. V měsíci odpracoval ${d} dní z ${td} pracovních. Jaká je hrubá mzda? (zaokrouhli na celé Kč)`,a:Math.round(salary/td*d),unit:'Kč'};
},
function(){
let rate=rand(120,240)*5;
let h=rand(80,180);
return {q:`Hodinová sazba je ${rate} Kč, odpracováno ${h} hodin. Kolik činí hrubá mzda?`,a:rate*h,unit:'Kč'};
},
function(){
let salary=rand(300,700)*100;
let bonusP=rand(5,25);
let bonus=Math.round(salary*bonusP/100);
return {q:`Základní mzda je ${salary} Kč, zaměstnanec dostal prémii ${bonusP}% (tj. ${bonus} Kč). Jaká je celková hrubá mzda?`,a:salary+bonus,unit:'Kč'};
},
function(){
let rate=rand(130,260)*5;
let h=rand(80,160);
let oh=rand(5,20);
return {q:`Zaměstnanec odpracoval ${h} hodin + ${oh} hodin přesčasů. Sazba ${rate} Kč/h, přesčas +25%. Jaká je hrubá mzda?`,a:Math.round(rate*h+rate*oh*1.25),unit:'Kč'};
},
function(){
let rate=rand(100,200)*5;
let h=rand(15,22);
let d=rand(10,22);
return {q:`Hodinová sazba ${rate} Kč, odpracováno ${h} dní po 8 hodinách a ${d} dní po 6 hodinách. Vše přesčas se nepočítá. Jaká je hrubá mzda?`,a:rate*(h*8+d*6),unit:'Kč'};
},
function(){
let salary=rand(300,500)*100;
let days=rand(15,22);
return {q:`Měsíční mzda ${salary} Kč za ${22} pracovních dní. Zaměstnanec odpracoval ${days} dní. Jaká je jeho poměrná hrubá mzda?`,a:Math.round(salary/22*days),unit:'Kč'};
},
function(){
let rate=rand(140,280)*5;
let stand=rand(140,160);
let overtime=rand(5,15);
let bonus=rand(2000,8000);
return {q:`Hrubá mzda: ${rate} Kč/h po ${stand} hodin, ${overtime} hodin přesčas (+25%), mimořádná odměna ${bonus} Kč. Vypočítej celkovou hrubou mzdu.`,a:Math.round(rate*stand+rate*overtime*1.25+bonus),unit:'Kč'};
}
];

// ---------- ČISTÁ MZDA ----------
generators.cista_mzda = [
function(){
let g=rand(250,550)*100;
let soc=Math.round(g*0.065);
let zdr=Math.round(g*0.045);
let dan=Math.round(g*0.15)-2570;
if(dan<0)dan=0;
let c=g-soc-zdr-dan;
return {q:`Hrubá mzda je ${g} Kč. Vypočítej čistou mzdu.\nSociální pojištění: 6,5 %, zdravotní: 4,5 %, daň: 15 % se slevou 2 570 Kč.`,a:c,unit:'Kč'};
},
function(){
let g=rand(200,400)*100;
let soc=Math.round(g*0.065);
let zdr=Math.round(g*0.045);
let dan=Math.round(g*0.15)-2570;
if(dan<0)dan=0;
let c=g-soc-zdr-dan;
return {q:`Hrubá mzda: ${g} Kč. Kolik činí čistá mzda?\n(SP 6,5%, ZP 4,5%, daň 15%, sleva 2 570 Kč)`,a:c,unit:'Kč'};
},
function(){
let g=rand(280,600)*100;
let soc=Math.round(g*0.065);
let zdr=Math.round(g*0.045);
let dan=Math.round(g*0.15)-2570;
if(dan<0)dan=0;
let c=g-soc-zdr-dan;
let soucet=soc+zdr+dan;
return {q:`Hrubá mzda ${g} Kč. Zaměstnanci bylo sraženo ${soucet} Kč (soc.+zdr.+daň po slevě). Jaká je čistá mzda?`,a:c,unit:'Kč'};
},
function(){
let g=rand(300,700)*100;
let sleva=rand(1000,3000);
let soc=Math.round(g*0.065);
let zdr=Math.round(g*0.045);
let dan=Math.round(g*0.15)-sleva;
if(dan<0)dan=0;
let c=g-soc-zdr-dan;
return {q:`Hrubá mzda ${g} Kč, sleva na dani ${sleva} Kč. SP 6,5%, ZP 4,5%, daň 15%. Kolik je čistá mzda?`,a:c,unit:'Kč'};
},
function(){
let g=rand(220,450)*100;
let soc=Math.round(g*0.065);
let zdr=Math.round(g*0.045);
let dan=Math.round(g*0.15)-2570;
if(dan<0)dan=0;
let c=g-soc-zdr-dan;
return {q:`Pan Malý má hrubou mzdu ${g} Kč. Vypočítej čistou mzdu (SP 6,5%, ZP 4,5%, daň 15%, sleva 2 570 Kč).`,a:c,unit:'Kč'};
}
];

// ---------- ČÁSTKA K VÝPLATĚ ----------
generators.castka_k_vyplate = [
function(){
let c=rand(180,450)*100;
let zaloha=rand(1000,5000);
return {q:`Čistá mzda je ${c} Kč. Zaměstnanec dostal zálohu ${zaloha} Kč. Kolik mu zbývá k výplatě?`,a:c-zaloha,unit:'Kč'};
},
function(){
let c=rand(200,500)*100;
let stravenky=rand(500,2000);
let pujcka=rand(1000,4000);
return {q:`Čistá mzda ${c} Kč, stravenky ${stravenky} Kč, splátka půjčky ${pujcka} Kč. Kolik činí částka k výplatě?`,a:c-stravenky-pujcka,unit:'Kč'};
},
function(){
let c=rand(220,480)*100;
let spoření=rand(1000,3000);
let pojisteni=rand(300,1200);
return {q:`Čistá mzda ${c} Kč. Srážky: spoření ${spoření} Kč, životní pojištění ${pojisteni} Kč. Jaká je částka k výplatě?`,a:c-spoření-pojisteni,unit:'Kč'};
},
function(){
let c=rand(250,550)*100;
let exec=rand(2000,8000);
return {q:`Čistá mzda ${c} Kč, exekuční srážka ${exec} Kč. Kolik zaměstnanec dostane k výplatě?`,a:c-exec,unit:'Kč'};
},
function(){
let g=rand(280,520)*100;
let soc=Math.round(g*0.065);
let zdr=Math.round(g*0.045);
let dan=Math.round(g*0.15)-2570;
if(dan<0)dan=0;
let c=g-soc-zdr-dan;
let zaloha=rand(2000,6000);
return {q:`Hrubá mzda ${g} Kč. Vypočítej čistou mzdu (SP 6,5%, ZP 4,5%, daň 15%, sleva 2 570 Kč) a poté odečti zálohu ${zaloha} Kč. Jaká je částka k výplatě?`,a:c-zaloha,unit:'Kč'};
}
];

// ---------- DOVOLENÁ ----------
generators.dovolena = [
function(){
let denni=rand(800,2500);
let dni=rand(1,20);
return {q:`Průměrný denní výdělek je ${denni} Kč. Zaměstnanec čerpá ${dni} dní dovolené. Kolik činí náhrada mzdy?`,a:denni*dni,unit:'Kč'};
},
function(){
let hodinovy=rand(120,300);
let hodin=rand(8,80);
return {q:`Průměrný hodinový výdělek ${hodinovy} Kč, dovolená ${hodin} hodin. Jaká je náhrada mzdy za dovolenou?`,a:hodinovy*hodin,unit:'Kč'};
},
function(){
let mesicni=rand(300,600)*100;
let denni=Math.round(mesicni/22);
let dni=rand(1,25);
return {q:`Měsíční mzda ${mesicni} Kč. Průměrný denní výdělek je ${mesicni} / 22 = ${denni} Kč. Zaměstnanec čerpá ${dni} dní dovolené. Kolik dostane?`,a:denni*dni,unit:'Kč'};
},
function(){
let hodinovy=rand(130,280);
let dni=rand(1,15);
return {q:`Průměrný hodinový výdělek ${hodinovy} Kč, dovolená ${dni} dní (8 hodin denně). Vypočítej náhradu mzdy.`,a:hodinovy*dni*8,unit:'Kč'};
},
function(){
let kvartal=rand(800,2500);
let dni=rand(1,20);
let odprac=rand(60,180);
return {q:`Za poslední čtvrtletí odpracováno ${odprac} dní, výdělek ${kvartal*odprac} Kč. Průměrný denní výdělek: ${kvartal} Kč. Dovolená ${dni} dní. Náhrada?`,a:kvartal*dni,unit:'Kč'};

}
];

// ============================================================
// GAME STATE
// ============================================================
let state = {
questions: [],
index: 0,
score: 0,
total: 0,
timeLimit: 300,
timeLeft: 300,
timerId: null,
active: false,
results: [],
selectedCategories: new Set(),
currentAnswer: null
};

// ============================================================
// UI REFS
// ============================================================
const $ = id => document.getElementById(id);
const welcomeScreen = $('welcomeScreen');
const gameScreen = $('gameScreen');
const resultScreen = $('resultScreen');
const categoryGrid = $('categoryGrid');
const timeBtns = document.querySelectorAll('.time-btn');
const startBtn = $('startBtn');
const restartBtn = $('restartBtn');
const scoreDisplay = $('scoreDisplay');
const timerDisplay = $('timerDisplay');
const progressFill = $('progressFill');
const reactionEmoji = $('reactionEmoji');
const reactionText = $('reactionText');
const reactionSub = $('reactionSub');
const reactionArea = $('reactionArea');
const questionBox = $('questionBox');
const questionUnit = $('questionUnit');
const answerInput = $('answerInput');
const submitBtn = $('submitBtn');
const answerFeedback = $('answerFeedback');
const resultEmoji = $('resultEmoji');
const resultTitle = $('resultTitle');
const resultSub = $('resultSub');
const statScore = $('statScore');
const statTotal = $('statTotal');
const statPercent = $('statPercent');
const detailList = $('detailList');

// ============================================================
// UI: CATEGORY SELECTION
// ============================================================
const allBtn = document.querySelector('.all-btn');
const catBtns = document.querySelectorAll('.cat-btn:not(.all-btn)');

allBtn.addEventListener('click',()=>{
if(!allBtn.classList.contains('selected')){
allBtn.classList.add('selected');
catBtns.forEach(b=>b.classList.add('selected'));
} else {
allBtn.classList.remove('selected');
catBtns.forEach(b=>b.classList.remove('selected'));
}
});

catBtns.forEach(btn=>{
btn.addEventListener('click',()=>{
btn.classList.toggle('selected');
const allSelected = [...catBtns].every(b=>b.classList.contains('selected'));
allBtn.classList.toggle('selected',allSelected);
});
});

// ============================================================
// UI: TIME SELECTION
// ============================================================
timeBtns.forEach(btn=>{
btn.addEventListener('click',()=>{
timeBtns.forEach(b=>b.classList.remove('selected'));
btn.classList.add('selected');
});
});

// ============================================================
// GAME FUNCTIONS
// ============================================================
function buildQuestionPool(){
const selected = [...catBtns].filter(b=>b.classList.contains('selected')).map(b=>b.dataset.cat);
if(selected.length===0)return[];
let pool=[];
selected.forEach(cat=>{
if(generators[cat]){
generators[cat].forEach(fn=>pool.push({fn,cat}));
}
});
// generate 2-3 questions per template, shuffle at end
let questions=[];
pool.forEach(item=>{
let count=rand(1,2);
for(let i=0;i<count;i++){
let q=item.fn();
questions.push({question:q.q,answer:q.a,unit:q.unit,cat:item.cat});
}
});
// shuffle
for(let i=questions.length-1;i>0;i--){
let j=rand(0,i);
[questions[i],questions[j]]=[questions[j],questions[i]];
}
return questions;
}

function setTeacherReaction(reaction){
reactionEmoji.textContent=reaction.emoji;
reactionText.innerHTML=`${reaction.text} <span class="reaction-sub">${reaction.sub}</span>`;
reactionEmoji.classList.remove('bounce');
void reactionEmoji.offsetWidth;
reactionEmoji.classList.add('bounce');
}

function showQuestion(){
if(!state.active) return;
if(state.index>=state.questions.length){
endGame();
return;
}
const q=state.questions[state.index];
questionBox.innerHTML=`${q.question}`;
questionUnit.textContent=`Odpověď v ${q.unit}`;
answerInput.value='';
answerInput.disabled=false;
answerInput.focus();
submitBtn.disabled=false;
answerFeedback.textContent='';
answerFeedback.className='answer-feedback';
answerInput.className='';
state.currentAnswer=q.answer;

progressFill.style.width=`${(state.index/state.questions.length)*100}%`;
scoreDisplay.textContent=`${state.score}/${state.total}`;
}

function checkAnswer(){
const q=state.questions[state.index];
const userVal=parseFloat(answerInput.value);
const correct=q.answer;
if(isNaN(userVal)){
answerFeedback.textContent='Zadej číslo!';
answerFeedback.className='answer-feedback wrong';
return;
}
const diff=Math.abs(userVal-correct);
let tolerance=1;
if(Math.abs(correct)>=10000)tolerance=5;
else if(Math.abs(correct)>=1000)tolerance=2;
const isCorrect=diff<=tolerance;

state.total++;
if(isCorrect){
state.score++;
answerInput.className='correct';
answerFeedback.textContent=`✅ Správně! (${correct} ${q.unit})`;
answerFeedback.className='answer-feedback correct';
setTeacherReaction(pick(REACTIONS_GUESS.correct));
state.results.push({q:q.question,a:correct,ua:userVal,correct:true,cat:q.cat});
} else {
answerInput.className='wrong';
answerFeedback.textContent=`❌ Špatně. Správně: ${correct} ${q.unit}`;
answerFeedback.className='answer-feedback wrong';
setTeacherReaction(pick(REACTIONS_GUESS.wrong));
state.results.push({q:q.question,a:correct,ua:userVal,correct:false,cat:q.cat});
}

answerInput.disabled=true;
submitBtn.disabled=true;
state.index++;

setTimeout(()=>{
if(state.active){
showQuestion();
}
},state.index<state.questions.length?1200:1200);
}

function endGame(){
if(!state.active)return;
state.active=false;
if(state.timerId){clearInterval(state.timerId);state.timerId=null;}
showResultScreen();
}

function updateTimerDisplay(){
const mins=Math.floor(state.timeLeft/60);
const secs=state.timeLeft%60;
timerDisplay.textContent=`${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
timerDisplay.classList.toggle('warning',state.timeLeft<=30);
}

function startTimer(){
updateTimerDisplay();
state.timerId=setInterval(()=>{
state.timeLeft--;
updateTimerDisplay();
if(state.timeLeft<=0){
endGame();
}
},1000);
}

// ============================================================
// SCREEN MANAGEMENT
// ============================================================
function showWelcome(){
welcomeScreen.classList.add('active');
gameScreen.classList.remove('active');
resultScreen.classList.remove('active');
}

function showGame(){
welcomeScreen.classList.remove('active');
gameScreen.classList.add('active');
resultScreen.classList.remove('active');
}

function showResultScreen(){
welcomeScreen.classList.remove('active');
gameScreen.classList.remove('active');
resultScreen.classList.add('active');
showResults();
}

// ============================================================
// START / RESTART
// ============================================================
function initGame(){
const selected = [...catBtns].filter(b=>b.classList.contains('selected')).map(b=>b.dataset.cat);
if(selected.length===0){alert('Vyber alespoň jednu kategorii!');return;}
const timeBtn=document.querySelector('.time-btn.selected');
state.timeLimit=parseInt(timeBtn.dataset.time);
state.timeLeft=state.timeLimit;
state.score=0;
state.total=0;
state.index=0;
state.active=true;
state.results=[];
state.questions=buildQuestionPool();
if(state.questions.length===0){alert('Nepodařilo se vygenerovat otázky.');return;}

showGame();
setTeacherReaction({emoji:'😊',text:'Hodně štěstí!',sub:'Začínáme! Začni odpovídat.'});
scoreDisplay.textContent='0/0';
updateTimerDisplay();

if(state.timeLimit>0){
startTimer();
} else {
timerDisplay.textContent='♾️';
}

showQuestion();
}

function showResults(){
const pct=state.total>0?Math.round(state.score/state.total*100):0;
statScore.textContent=state.score;
statTotal.textContent=state.total;
statPercent.textContent=pct+'%';

let reaction;
if(pct>=90)reaction=REACTIONS.veryGood;
else if(pct>=75)reaction=REACTIONS.good;
else if(pct>=50)reaction=REACTIONS.medium;
else if(pct>=25)reaction=REACTIONS.bad;
else reaction=REACTIONS.veryBad;

resultEmoji.textContent=reaction.emoji;
resultTitle.textContent=reaction.text;
resultSub.textContent=`${reaction.sub} (${pct}% úspěšnost)`;

detailList.innerHTML='';
state.results.forEach(r=>{
const div=document.createElement('div');
div.className=`detail-item ${r.correct?'result-correct':'result-wrong'}`;
const icon=r.correct?'✅':'❌';
div.innerHTML=`
<span class="detail-icon">${icon}</span>
<span class="detail-q">${r.q}</span>
<span class="detail-a">${r.correct?r.a+` Kč`:`<span class="detail-ua">${r.ua} Kč</span>${r.a} Kč`}</span>
`;
detailList.appendChild(div);
});
}

startBtn.addEventListener('click',initGame);
restartBtn.addEventListener('click',()=>{
showWelcome();
});

answerInput.addEventListener('keydown',e=>{
if(e.key==='Enter'&&!submitBtn.disabled)checkAnswer();
});
submitBtn.addEventListener('click',checkAnswer);

// ============================================================
// WELCOME: pre-highlight categories from query param? No, defaults ok.
// ============================================================
// Default: all selected already in HTML
showWelcome();
</script>
